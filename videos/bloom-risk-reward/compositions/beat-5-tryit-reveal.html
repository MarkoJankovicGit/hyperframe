    <script>
      (function() {
        const W = [
          { word: "Imagine", t: 18.10 + 0.3, e: 18.10 + 1.3 },
          { word: "you", t: 19.4, e: 19.5 },
          { word: "invest", t: 19.6, e: 19.8 },
          { word: "ten", t: 19.9, e: 20.1 },
          { word: "dollars", t: 20.2, e: 20.6 },
          { word: "risk", t: 23.478, e: 23.8 },
          { word: "ten", t: 23.9, e: 24.1 },
          { word: "dollars.", t: 24.2, e: 24.7 }
        ];
        const offset = 17.90;
        const _norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, "").trim();
        function landOn(phrase, dur) {
          const ws = _norm(phrase).split(/\s+/);
          for (let i = 0; i <= W.length - ws.length; i++) {
            let ok = true;
            for (let j = 0; j < ws.length; j++) {
              if (_norm(W[i + j].word) !== ws[j]) { ok = false; break; }
            }
            if (ok) return (W[i].t - offset) - dur;
          }
          return 0;
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Try-it entrance
        tl.fromTo("#b5-badge", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" }, 0.3);
        tl.fromTo("#b5-slot-1", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, landOn("ten dollars", 0.5));

        // Reveal transition
        tl.to("#b5-tryit-content", { opacity: 0, scale: 0.9, duration: 0.4, ease: "power2.in" }, landOn("risk", 0.6));
        tl.fromTo("#b5-counter-wrap", { scale: 1.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.2)" }, landOn("risk", 0.4));

        // Counter ramp
        const val = { n: 0 };
        tl.to(val, { 
          n: 10, 
          duration: 0.8, 
          ease: "power2.out", 
          onUpdate: () => { document.getElementById("b5-counter").textContent = "$" + Math.round(val.n); }
        }, landOn("risk", 0.2));

        window.__timelines["bloom-risk-reward-beat-5"] = tl;
      })();
