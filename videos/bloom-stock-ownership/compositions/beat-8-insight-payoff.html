<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beat 8: Insight - Price to Value</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:ital,wght@0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    #beat8 { position: absolute; inset: 0; width: 1080px; height: 1920px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    #beat8-seesaw-container { position: relative; width: 700px; height: 400px; display: flex; align-items: center; justify-content: center; margin-bottom: 80px; opacity: 0; perspective: 1200px; }
    .beat8-left-side { position: absolute; left: 80px; top: 100px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .beat8-left-label { font-family: "Inter", system-ui, sans-serif; font-size: 44px; font-weight: 700; color: #1C2329; }
    .beat8-left-value { font-family: "Inter Tight", system-ui, sans-serif; font-size: 120px; font-weight: 800; color: #1658FF; line-height: 1; }
    .beat8-right-side { position: absolute; right: 80px; top: 100px; display: flex; flex-direction: column; align-items: center; gap: 16px; opacity: 0; }
    .beat8-right-label { font-family: "Inter", system-ui, sans-serif; font-size: 44px; font-weight: 700; color: #1C2329; }
    .beat8-right-value { font-family: "Inter Tight", system-ui, sans-serif; font-size: 120px; font-weight: 800; color: #01CD74; line-height: 1; }
    .beat8-bar { position: absolute; width: 560px; height: 40px; background: linear-gradient(to right, #1658FF, #01CD74); border-radius: 20px; top: 80px; left: 50%; transform-origin: center; transform: translateX(-50%) rotateZ(0deg); }
    .beat8-headline { position: relative; z-index: 2; text-align: center; max-width: 920px; line-height: 1.1; font-family: "Inter Tight", system-ui, sans-serif; font-weight: 800; font-style: italic; text-transform: uppercase; color: #1C2329; letter-spacing: -0.02em; font-size: 85px; }
    .beat8-word { display: inline-block; opacity: 0; margin: 0 0.1em; }
  </style>
</head>
<body>
  <template data-start="0" data-duration="4.42">
    <div id="beat8" class="scene" data-composition-id="bloom-stock-ownership-beat-8" data-width="1080" data-height="1920" data-start="0" data-duration="4.42">
      <div id="beat8-seesaw-container">
        <svg id="beat8-seesaw" viewBox="0 0 700 400">
          <polygon points="350,180 320,240 380,240" fill="#1C2329" opacity="0.5" />
        </svg>
        <div class="beat8-left-side">
          <div class="beat8-left-label">Investment</div>
          <div class="beat8-left-value">$100</div>
        </div>
        <div class="beat8-right-side">
          <div class="beat8-right-label">Now Worth</div>
          <div class="beat8-right-value" id="beat8-counter">$100</div>
        </div>
        <div class="beat8-bar"></div>
      </div>
      <div class="beat8-headline">
        <span class="beat8-word">Price</span>
        <span class="beat8-word">up</span>
        <span class="beat8-word">=</span>
        <span class="beat8-word">Value</span>
        <span class="beat8-word">up.</span>
      </div>
    </div>
  </template>

  <script>
    // ── TIMELINE REGISTRATION ────────────────────────────────────────────
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["bloom-stock-ownership-beat-8"] = tl;

    const W = [
      { w: "If", s: 0.000, e: 0.221 },
      { w: "your", s: 0.251, e: 0.451 },
      { w: "stock's", s: 0.481, e: 0.871 },
      { w: "price", s: 0.891, e: 1.191 },
      { w: "goes", s: 1.221, e: 1.421 },
      { w: "up,", s: 1.451, e: 1.671 },
      { w: "your", s: 1.691, e: 1.881 },
      { w: "investment", s: 1.911, e: 2.401 },
      { w: "increases", s: 2.431, e: 2.791 },
      { w: "in", s: 2.821, e: 2.891 },
      { w: "value.", s: 2.911, e: 3.351 }
    ];

    function _norm(s) { return s.toLowerCase().replace(/[^p{L}p{N}'-]/gu, ""); }
    function _findPhrase(phrase) {
      const tokens = phrase.toLowerCase().split(/s+/).map(_norm).filter(Boolean);
      if (!tokens.length) throw new Error("empty");
      const hits = [];
      for (let i = 0; i <= W.length - tokens.length; i++) {
        let ok = true;
        for (let j = 0; j < tokens.length; j++) {
          if (_norm(W[i + j].w) !== tokens[j]) { ok = false; break; }
        }
        if (ok) hits.push(i);
      }
      if (hits.length === 0) throw new Error("not found");
      if (hits.length > 1) throw new Error("ambiguous");
      return { startIdx: hits[0], endIdx: hits[0] + tokens.length - 1 };
    }
    function at(phrase) { return W[_findPhrase(phrase).startIdx].s; }
    function landOn(phrase, duration = 0) { return at(phrase) - duration; }
    function landAfter(phrase, duration = 0) { return W[_findPhrase(phrase).endIdx].e - duration; }

    const tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["bloom-stock-ownership-beat-8"] = tl;

    tl.from("#beat8-seesaw-container", { scale: 0, opacity: 0, duration: 0.5, ease: "back.out(1.7)" }, 0);
    tl.to(".beat8-bar", { rotationZ: -15, duration: 0.8, ease: "power2.out" }, landOn("price goes up", 0.8));
    tl.from(".beat8-right-side", { opacity: 0, y: 20, duration: 0.5, ease: "power2.out" }, landOn("price goes up", 0.8) + 0.2);

    const counterProxy = { v: 100 };
    tl.to(counterProxy, { v: 150, duration: 1.2, ease: "power2.out", onUpdate: () => { document.getElementById("beat8-counter").textContent = "$" + Math.round(counterProxy.v); } }, landAfter("increases", 1.2));

    tl.to(".beat8-bar", { rotationZ: -13, duration: 2.0, ease: "sine.inOut", yoyo: true, repeat: 1, overwrite: "auto" }, landAfter("increases", 1.2) + 0.5);

    const WORDS = ["Price", "up", "=", "Value", "up."];
    document.querySelectorAll(".beat8-word").forEach((el, i) => {
      const slideDistance = 50 - i * 10;
      tl.from(el, { x: slideDistance, y: 14, opacity: 0, duration: 0.35, ease: "power2.out" }, landOn(WORDS[i], 0.35));
    });

    tl.to("#beat8", { opacity: 0, duration: 0.2, ease: "power2.in" }, 4.22);
    tl.set("#beat8", { visibility: "hidden" }, 4.42);
  </script>
</body>
</html>
