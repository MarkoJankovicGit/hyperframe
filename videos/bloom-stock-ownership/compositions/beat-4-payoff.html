<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beat 4: Payoff</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:ital,wght@0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }

    #beat4 {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .beat4-headline {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 920px;
      line-height: 1.15;
      font-family: "Inter Tight", system-ui, sans-serif;
      font-weight: 800;
      font-style: italic;
      text-transform: uppercase;
      color: #0F172A;
      letter-spacing: -0.02em;
      font-size: 110px;
      margin-bottom: 100px;
    }

    .beat4-svg-container {
      position: relative;
      z-index: 2;
      width: 700px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .beat4-svg-container svg {
      width: 100%;
      height: 100%;
      opacity: 0;
    }

    .beat4-curve-path {
      stroke-dasharray: 350;
      stroke-dashoffset: 350;
    }

    .beat4-label {
      position: absolute;
      z-index: 3;
      font-family: "Inter", system-ui, sans-serif;
      font-size: 44px;
      font-weight: 600;
      color: #1658FF;
      opacity: 0;
    }

    .beat4-label-top {
      top: 80px;
      right: 100px;
    }

    .beat4-label-bottom {
      bottom: 100px;
      left: 80px;
    }
  </style>
</head>
<body>
  <template data-start="0" data-duration="5.88" data-composition-id="bloom-stock-ownership-beat-4" data-width="1080" data-height="1920">
    <div id="beat4" class="scene" data-composition-id="bloom-stock-ownership-beat-4" data-width="1080" data-height="1920" data-start="0" data-duration="5.88">
      <div class="beat4-headline">
        As a part-owner, you hope your company grows
      </div>

      <div class="beat4-svg-container">
        <svg viewBox="0 0 700 400" preserveAspectRatio="xMidYMid meet">
          <line x1="60" y1="350" x2="650" y2="350" stroke="#E8E9EA" stroke-width="3" />
          <line x1="60" y1="50" x2="60" y2="350" stroke="#E8E9EA" stroke-width="3" />
          <path class="beat4-curve-path" d="M 60 320 Q 180 280 300 220 T 540 80 L 600 60" stroke="#1658FF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          <circle class="beat4-apex-dot" cx="540" cy="80" r="12" fill="#1658FF" opacity="0" />
        </svg>
        <div class="beat4-label beat4-label-top">your money</div>
        <div class="beat4-label beat4-label-bottom">time</div>
      </div>
    </div>
  </template>

  <script>
    // ── TIMELINE REGISTRATION ────────────────────────────────────────────
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["bloom-stock-ownership-beat-4"] = tl;

    const W = [
      { w: "As", s: 0.000, e: 0.181 },
      { w: "a", s: 0.201, e: 0.281 },
      { w: "part-owner,", s: 0.321, e: 0.871 },
      { w: "you", s: 0.901, e: 1.051 },
      { w: "hope", s: 1.091, e: 1.321 },
      { w: "that", s: 1.351, e: 1.481 },
      { w: "your", s: 1.511, e: 1.711 },
      { w: "company", s: 1.751, e: 2.061 },
      { w: "grows", s: 2.131, e: 2.481 },
      { w: "so", s: 2.521, e: 2.671 },
      { w: "you", s: 2.701, e: 2.851 },
      { w: "grow", s: 2.891, e: 3.121 },
      { w: "your", s: 3.151, e: 3.361 },
      { w: "money", s: 3.401, e: 3.781 },
      { w: "alongside", s: 3.831, e: 4.281 },
      { w: "it.", s: 4.331, e: 4.881 }
    ];

    function _norm(s) { return s.toLowerCase().replace(/[^\p{L}\p{N}'-]/gu, ""); }
    function _findPhrase(phrase) {
      const tokens = phrase.toLowerCase().split(/\s+/).map(_norm).filter(Boolean);
      if (!tokens.length) throw new Error(`landOn: empty phrase`);
      const hits = [];
      for (let i = 0; i <= W.length - tokens.length; i++) {
        let ok = true;
        for (let j = 0; j < tokens.length; j++) {
          if (_norm(W[i + j].w) !== tokens[j]) { ok = false; break; }
        }
        if (ok) hits.push(i);
      }
      if (hits.length === 0) throw new Error(`landOn: phrase "${phrase}" not found`);
      if (hits.length > 1) {
        const times = hits.map(i => W[i].s.toFixed(3) + "s").join(", ");
        throw new Error(`landOn: phrase "${phrase}" matches ${hits.length} at [${times}]`);
      }
      return { startIdx: hits[0], endIdx: hits[0] + tokens.length - 1 };
    }
    function at(phrase) { return W[_findPhrase(phrase).startIdx].s; }
    function landOn(phrase, duration = 0) { return at(phrase) - duration; }
    function landAfter(phrase, duration = 0) { return W[_findPhrase(phrase).endIdx].e - duration; }

    const tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["bloom-stock-ownership-beat-4"] = tl;

    tl.from(".beat4-headline", { opacity: 0, scale: 0.95, duration: 0.4, ease: "power2.out" }, 0);
    tl.from(".beat4-svg-container svg", { opacity: 0, scale: 0.9, duration: 0.5, ease: "back.out(1.5)" }, 0.15);
    tl.to(".beat4-curve-path", { strokeDashoffset: 0, duration: 1.5, ease: "power2.out" }, landOn("grows", 1.5));
    tl.fromTo(".beat4-apex-dot", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, landOn("money", 0.3));
    tl.to(".beat4-apex-dot", { scale: 1.4, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, landOn("money", 0.3) + 0.3);
    tl.from(".beat4-label-top", { x: 40, opacity: 0, duration: 0.35, ease: "power2.out" }, landOn("money", 0.35));
    tl.from(".beat4-label-bottom", { x: -40, opacity: 0, duration: 0.35, ease: "power2.out" }, landOn("alongside", 0.35));
    tl.to(".beat4-svg-container svg", { scale: 1.02, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 1, overwrite: "auto" }, landOn("grows", 1.5) + 0.5);
    tl.to("#beat4", { opacity: 0, filter: "blur(20px)", duration: 0.35, ease: "power3.in" }, 5.53);
    tl.set("#beat4", { visibility: "hidden" }, 5.88);
  </script>
</body>
</html>
