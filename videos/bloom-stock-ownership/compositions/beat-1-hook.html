<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beat 1: Hook</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:ital,wght@0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }

    #beat1 {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      background: #1658FF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Canvas ticker tape */
    #beat1-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      opacity: 0.5;
    }

    /* Headline container */
    .beat1-headline {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 920px;
      line-height: 1.1;
      font-family: "Inter Tight", system-ui, sans-serif;
      font-weight: 800;
      font-style: italic;
      text-transform: uppercase;
      color: #FFFFFF;
      letter-spacing: -0.02em;
    }

    .beat1-word {
      display: inline-block;
      opacity: 0;
      margin: 0 0.1em;
      font-size: 110px;
    }

    /* AAPL logo container */
    .beat1-logo-container {
      position: absolute;
      z-index: 3;
      width: 140px;
      height: 140px;
      background: #1C2329;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 24px 60px rgba(6, 10, 30, 0.28);
      opacity: 0;
      bottom: 320px;
      right: 140px;
    }

    .beat1-logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 20px;
    }
  </style>
</head>
<body>
  <template data-start="0" data-duration="2.80">
    <div id="beat1" class="scene" data-composition-id="bloom-stock-ownership-beat-1" data-width="1080" data-height="1920" data-start="0" data-duration="2.80">
      <canvas id="beat1-canvas"></canvas>

      <div class="beat1-headline">
        <span class="beat1-word">You</span>
        <span class="beat1-word">can</span>
        <span class="beat1-word">actually</span>
        <span class="beat1-word">own</span>
        <span class="beat1-word">a</span>
        <span class="beat1-word">piece</span>
        <span class="beat1-word">of</span>
        <span class="beat1-word">Apple.</span>
      </div>

      <div class="beat1-logo-container">
        <img src="../logos/AAPL.png" alt="Apple Inc." />
      </div>
    </div>
  </template>

  <script>
    // ── TIMELINE REGISTRATION ────────────────────────────────────────────
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["bloom-stock-ownership-beat-1"] = tl;

    // ── VO WORD TIMING (beat-relative, starting at t=0) ──────────────────
    const W = [
      { w: "You", s: 0.000, e: 0.081 },
      { w: "can", s: 0.121, e: 0.241 },
      { w: "actually", s: 0.285, e: 0.637 },
      { w: "own", s: 0.737, e: 1.037 },
      { w: "a", s: 1.117, e: 1.197 },
      { w: "piece", s: 1.237, e: 1.437 },
      { w: "of", s: 1.464, e: 1.518 },
      { w: "Apple.", s: 1.585, e: 2.000 }
    ];

    // ── PHRASE-ANCHORED TIMING HELPERS ────────────────────────────────────
    function _norm(s) { return s.toLowerCase().replace(/[^\p{L}\p{N}'-]/gu, ""); }
    function _findPhrase(phrase) {
      const tokens = phrase.toLowerCase().split(/\s+/).map(_norm).filter(Boolean);
      if (!tokens.length) throw new Error(`landOn: empty phrase`);
      const hits = [];
      for (let i = 0; i <= W.length - tokens.length; i++) {
        let ok = true;
        for (let j = 0; j < tokens.length; j++) {
          if (_norm(W[i + j].w) !== tokens[j]) { ok = false; break; }
        }
        if (ok) hits.push(i);
      }
      if (hits.length === 0) {
        throw new Error(`landOn: phrase "${phrase}" not found in transcript`);
      }
      if (hits.length > 1) {
        const times = hits.map(i => W[i].s.toFixed(3) + "s").join(", ");
        throw new Error(`landOn: phrase "${phrase}" matches ${hits.length} occurrences at [${times}]. Use a longer phrase to disambiguate.`);
      }
      return { startIdx: hits[0], endIdx: hits[0] + tokens.length - 1 };
    }
    function at(phrase) { return W[_findPhrase(phrase).startIdx].s; }
    function landOn(phrase, duration = 0) { return at(phrase) - duration; }
    function landAfter(phrase, duration = 0) { return W[_findPhrase(phrase).endIdx].e - duration; }

    // ── CANVAS TICKER TAPE (deterministic PRNG) ──────────────────────────
    function mulberry32(seed) {
      return function () {
        let t = (seed += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const canvas = document.getElementById("beat1-canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 1080;
    canvas.height = 1920;

    const rand = mulberry32(2024);
    const tickers = ["AAPL", "GOOGL", "MSFT", "NVDA", "TSLA", "AMZN", "META"];
    const tickerList = [];
    for (let i = 0; i < 20; i++) {
      tickerList.push({
        ticker: tickers[Math.floor(i * 123 % tickers.length)],
        x: rand() * 1080,
        y: -100 + rand() * 2020,
        speed: 15 + rand() * 10
      });
    }

    function drawTickerTape(t) {
      ctx.clearRect(0, 0, 1080, 1920);
      ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
      ctx.font = "bold 32px Inter";
      ctx.textAlign = "center";

      tickerList.forEach(item => {
        const y = (item.y + t * item.speed) % 2120;
        ctx.fillText(item.ticker, item.x, y);
      });
    }

    // Canvas ticker: fade in and scroll
    const canvasProxy = { time: 0 };
    tl.to(
      "#beat1-canvas",
      { opacity: 0.5, duration: 0.3, ease: "power2.out" },
      0
    );
    tl.to(
      canvasProxy,
      {
        time: 2.8,
        duration: 2.8,
        ease: "none",
        onUpdate: () => drawTickerTape(canvasProxy.time)
      },
      0
    );

    // Per-word headline: slide in from upper-left with decay
    const WORDS = ["You", "can", "actually", "own", "a", "piece", "of", "Apple."];
    document.querySelectorAll(".beat1-word").forEach((el, i) => {
      const slideDistance = 60 - i * 8;
      tl.from(
        el,
        {
          x: slideDistance,
          y: 14,
          opacity: 0,
          duration: 0.35,
          ease: "power2.out"
        },
        landOn(WORDS[i], 0.35)
      );
    });

    // AAPL logo: pop in on "Apple" with spring
    tl.from(
      ".beat1-logo-container",
      {
        scale: 0,
        opacity: 0,
        duration: 0.35,
        ease: "back.out(1.7)"
      },
      landOn("Apple", 0.35)
    );

    // Logo idle: gentle y yoyo rotation
    tl.to(
      ".beat1-logo-container",
      {
        y: -8,
        rotation: 1.5,
        duration: 2.2,
        ease: "sine.inOut",
        yoyo: true,
        repeat: 1,
        overwrite: "auto"
      },
      landOn("Apple", 0.35) + 0.35
    );

    // Exit: hide at end
    tl.set("#beat1", { visibility: "hidden" }, 2.80);
  </script>
</body>
</html>
