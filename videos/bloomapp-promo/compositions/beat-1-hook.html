<template id="beat-1-hook-template">
  <div
    data-composition-id="beat-1-hook"
    data-width="1080"
    data-height="1920"
    data-start="0"
    data-duration="2.6"
  >
    <div class="b1-scene">
      <canvas id="b1-ticker-canvas" width="1080" height="1920"></canvas>
      <img
        id="b1-star"
        class="b1-star"
        src="../capture/assets/695f5099208b94c9b420571c-bloom-star.png"
        alt=""
      />
      <div class="b1-badge b1-badge-primary">
        <span class="b1-badge-text">WALL STREET</span>
      </div>
      <div class="b1-badge b1-badge-secondary">
        <span class="b1-badge-text b1-secondary-text">SHOULDN&rsquo;T FEEL LIKE A SECRET CLUB</span>
      </div>
    </div>

    <style>
      [data-composition-id="beat-1-hook"] {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1658ff;
        font-family: "Inter Tight", "Inter", system-ui, sans-serif;
      }
      [data-composition-id="beat-1-hook"] .b1-scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 40px;
        padding: 120px 80px;
      }
      [data-composition-id="beat-1-hook"] #b1-ticker-canvas {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        opacity: 0.55;
        z-index: 0;
        pointer-events: none;
      }
      [data-composition-id="beat-1-hook"] .b1-star {
        position: absolute;
        top: 620px;
        left: 50%;
        margin-left: -260px;
        width: 520px;
        height: 520px;
        opacity: 0.42;
        z-index: 1;
        transform-origin: 50% 50%;
        pointer-events: none;
        filter: drop-shadow(0 12px 40px rgba(0, 0, 0, 0.25));
      }
      [data-composition-id="beat-1-hook"] .b1-badge {
        position: relative;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #1c2329;
        color: #ffffff;
        padding: 28px 56px;
        border-radius: 28px;
        box-shadow: 0 24px 64px rgba(6, 10, 30, 0.28);
      }
      [data-composition-id="beat-1-hook"] .b1-badge-primary {
        padding: 42px 72px;
      }
      [data-composition-id="beat-1-hook"] .b1-badge-secondary {
        max-width: 900px;
      }
      [data-composition-id="beat-1-hook"] .b1-badge-text {
        font-family: "Inter Tight", "Inter", system-ui, sans-serif;
        font-weight: 800;
        font-style: italic;
        font-size: 172px;
        letter-spacing: -0.012em;
        line-height: 0.92;
        text-transform: uppercase;
        white-space: nowrap;
        color: #ffffff;
      }
      [data-composition-id="beat-1-hook"] .b1-secondary-text {
        font-size: 70px;
        white-space: normal;
        text-align: center;
        line-height: 1.04;
      }
    </style>

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        // --- Canvas 2D vertical ticker tape (deterministic, scrolling up) ---
        const canvas = document.querySelector(
          '[data-composition-id="beat-1-hook"] #b1-ticker-canvas'
        );
        const ctx = canvas.getContext("2d");

        // Mulberry32 seeded PRNG for deterministic placement
        function mulberry32(seed) {
          return function () {
            let t = (seed += 0x6d2b79f5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        const rand = mulberry32(1337);
        const TOKENS = [
          "SPY +0.34%", "AAPL", "NVDA -2.1%", "TSLA", "MSFT +1.2%", "AMZN",
          "GOOGL", "META -0.4%", "BTC +3.8%", "ETH", "DJI", "QQQ +0.8%",
          "VIX", "BRK.B", "JPM -0.7%", "PLTR", "AMD +2.9%", "COIN",
          "SMCI", "WMT", "DIS -1.0%", "BABA +0.5%", "XOM", "UNH",
          "C 0.12%", "F -0.3%", "BAC +0.2%", "PYPL", "KO", "PEP +0.1%"
        ];
        const COLUMNS = 6;
        const COL_WIDTH = 1080 / COLUMNS;
        const ROW_SPACING = 72;
        const TOKEN_ROWS = Math.ceil(1920 / ROW_SPACING) + 6;

        // Pre-assign a token per (col, row) slot deterministically
        const grid = [];
        for (let c = 0; c < COLUMNS; c++) {
          const colTokens = [];
          const colOffset = Math.floor(rand() * ROW_SPACING);
          for (let r = 0; r < TOKEN_ROWS; r++) {
            colTokens.push({
              token: TOKENS[Math.floor(rand() * TOKENS.length)],
              yOffset: colOffset + r * ROW_SPACING,
              alpha: 0.35 + rand() * 0.5,
              size: 22 + Math.floor(rand() * 8),
            });
          }
          grid.push(colTokens);
        }

        function drawTicker(timeSec) {
          ctx.clearRect(0, 0, 1080, 1920);
          ctx.font = "500 24px 'Inter', system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const scroll = (timeSec * 48) % ROW_SPACING;
          for (let c = 0; c < COLUMNS; c++) {
            const x = c * COL_WIDTH + COL_WIDTH / 2;
            const col = grid[c];
            for (let r = 0; r < TOKEN_ROWS; r++) {
              const cell = col[r];
              const y = cell.yOffset - scroll;
              if (y < -40 || y > 1960) continue;
              ctx.fillStyle = "rgba(255, 255, 255, " + cell.alpha.toFixed(3) + ")";
              ctx.font = "600 " + cell.size + "px 'Inter', system-ui, sans-serif";
              ctx.fillText(cell.token, x, y);
            }
          }
        }
        drawTicker(0);

        // Drive canvas via GSAP proxy so it's deterministic + seekable
        const proxy = { t: 0 };
        tl.to(
          proxy,
          {
            t: 2.6,
            duration: 2.6,
            ease: "none",
            onUpdate: function () {
              drawTicker(proxy.t);
            },
          },
          0
        );

        // --- Entrance: background crashes in with scale 1.05 → 1 ---
        tl.from(
          '[data-composition-id="beat-1-hook"]',
          { scale: 1.05, duration: 0.3, ease: "power3.out" },
          0
        );

        // --- Yellow star: pops in at 0.4s, then slow rotation ---
        tl.from(
          '[data-composition-id="beat-1-hook"] .b1-star',
          { scale: 0, opacity: 0, duration: 0.5, ease: "back.out(1.6)" },
          0.35
        );
        tl.to(
          '[data-composition-id="beat-1-hook"] .b1-star',
          { rotation: 14, duration: 2.2, ease: "none" },
          0.35
        );

        // --- Badge 1: "WALL STREET" slams in at VO onset (~0.1s) ---
        tl.from(
          '[data-composition-id="beat-1-hook"] .b1-badge-primary',
          {
            y: -60,
            scale: 1.28,
            opacity: 0,
            duration: 0.36,
            ease: "power3.out",
          },
          0.1
        );
        tl.fromTo(
          '[data-composition-id="beat-1-hook"] .b1-badge-primary',
          { rotation: -1.5 },
          {
            rotation: 0,
            scale: 1,
            duration: 0.55,
            ease: "elastic.out(1, 0.55)",
          },
          0.4
        );

        // --- Subtle breathe on badge 1 after settle ---
        tl.to(
          '[data-composition-id="beat-1-hook"] .b1-badge-primary',
          {
            scale: 1.015,
            duration: 0.9,
            ease: "sine.inOut",
            yoyo: true,
            repeat: 1,
          },
          1.2
        );

        // --- Badge 2: "SHOULDN'T FEEL LIKE A SECRET CLUB" — wipes in at VO "shouldn't" (~0.546s) ---
        // Clip-path reveal left→right
        tl.set(
          '[data-composition-id="beat-1-hook"] .b1-badge-secondary',
          { clipPath: "inset(0 100% 0 0)" },
          0
        );
        tl.fromTo(
          '[data-composition-id="beat-1-hook"] .b1-badge-secondary',
          { y: 30, opacity: 0, clipPath: "inset(0 100% 0 0)" },
          {
            y: 0,
            opacity: 1,
            clipPath: "inset(0 0% 0 0)",
            duration: 0.55,
            ease: "power3.out",
          },
          0.546
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["beat-1-hook"] = tl;
      })();
    </script>
  </div>
</template>
