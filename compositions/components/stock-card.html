<!--
  Stock Card — Robinhood-style stock ticker card for financial videos.

  Usage: paste this snippet into your composition's HTML, then add
  one or more `.stock-card` elements with data attributes.

  Required data attributes:
    data-logo        — URL to company logo image (PNG/SVG with transparency)
    data-name        — Company name
    data-ticker      — Stock ticker symbol
    data-price       — Current price (number or string)

  Optional data attributes:
    data-exchange    — Exchange label, default "Nasdaq"
    data-change      — Absolute change (e.g. "+24.42" or "-18.0")
    data-change-pct  — Percent change (e.g. "2.41%" or "-18.0%")
    data-chart       — SVG path "d" attribute for sparkline
    data-market-cap  — Market cap string (e.g. "$2.54T")
    data-pe          — P/E ratio string (e.g. "66.18")
    data-volume      — Volume string (e.g. "24,988,072")
    data-theme       — "green" (up) or "red" (down), default "green"

  Customize:
    --sc-bg: card background (default #09090b)
    --sc-border: divider color (default rgba(167,139,250,0.15))
    --sc-radius: corner radius (default 0)
    --sc-width: card width (default 1080px)
    --sc-green: up color (default #22c55e)
    --sc-red: down color (default #e5383b)
    --sc-text: primary text (default #fafafa)
    --sc-muted: secondary text (default #a1a1aa)
    --sc-accent: active tab color (default #a78bfa)

  Timeline integration example:

  // Card entrance
  tl.fromTo("#my-card", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, startTime);

  // Chart draw
  tl.to("#my-card .sc-chart-path", { strokeDashoffset: 0, duration: 1.2, ease: "power2.out" }, startTime + 0.3);
-->

<style>
  .stock-card {
    --sc-bg: #09090b;
    --sc-border: rgba(167, 139, 250, 0.15);
    --sc-radius: 0px;
    --sc-width: 1080px;
    --sc-green: #22c55e;
    --sc-red: #e5383b;
    --sc-text: #fafafa;
    --sc-muted: #a1a1aa;
    --sc-accent: #a78bfa;

    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    max-width: var(--sc-width);
    height: 1920px;
    padding: 100px 60px 120px;
    background: var(--sc-bg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 36px;
    text-align: left;
    font-family: inherit;
  }

  .sc-header {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .sc-logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    object-fit: contain;
    flex-shrink: 0;
    background: #e4e4e7;
    padding: 8px;
  }

  .sc-title-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sc-name {
    font-size: 52px;
    font-weight: 700;
    color: var(--sc-text);
    line-height: 1.1;
    letter-spacing: -0.01em;
  }

  .sc-ticker {
    font-size: 24px;
    font-weight: 500;
    color: var(--sc-muted);
    line-height: 1.2;
  }

  .sc-price-block {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sc-price {
    font-size: 96px;
    font-weight: 800;
    color: var(--sc-text);
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .sc-change-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .sc-change {
    font-size: 32px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sc-change.up   { color: var(--sc-green); }
  .sc-change.down { color: var(--sc-red); }

  .sc-change-arrow {
    width: 0;
    height: 0;
    border-style: solid;
  }

  .sc-change.up .sc-change-arrow {
    border-width: 0 7px 10px 7px;
    border-color: transparent transparent var(--sc-green) transparent;
  }

  .sc-change.down .sc-change-arrow {
    border-width: 10px 7px 0 7px;
    border-color: var(--sc-red) transparent transparent transparent;
  }

  .sc-change-pct {
    font-size: 26px;
    font-weight: 500;
    color: var(--sc-muted);
  }

  .sc-chart-wrap {
    width: 100%;
    height: 480px;
    overflow: visible;
    flex-shrink: 0;
  }

  .sc-chart-wrap svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .sc-chart-path {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .sc-chart-path.up   { stroke: var(--sc-green); }
  .sc-chart-path.down { stroke: var(--sc-red); }

  .sc-chart-area {
    fill-opacity: 0.10;
  }

  .sc-chart-area.up   { fill: var(--sc-green); }
  .sc-chart-area.down { fill: var(--sc-red); }

  .sc-chart-dot {
    stroke: var(--sc-bg);
    stroke-width: 3;
  }

  .sc-chart-dot.up   { fill: var(--sc-green); }
  .sc-chart-dot.down { fill: var(--sc-red); }

  .sc-tabs {
    display: flex;
    gap: 8px;
  }

  .sc-tab {
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: 600;
    color: var(--sc-muted);
    background: transparent;
    border: 1px solid transparent;
  }

  .sc-tab.active {
    background: var(--sc-accent);
    color: #09090b;
    border-color: var(--sc-accent);
  }

  .sc-divider {
    width: 100%;
    height: 1px;
    background: var(--sc-border);
  }

  .sc-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 24px 32px;
    margin-top: 8px;
  }

  .sc-stat {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: calc(33.333% - 22px);
    flex-shrink: 0;
  }

  .sc-stat-label {
    font-size: 24px;
    font-weight: 500;
    color: var(--sc-muted);
  }

  .sc-stat-value {
    font-size: 36px;
    font-weight: 700;
    color: var(--sc-text);
  }
</style>

<script>
  (function () {
    document.querySelectorAll(".stock-card").forEach(function (card) {
      const logo      = card.dataset.logo;
      const name      = card.dataset.name;
      const ticker    = card.dataset.ticker;
      const exchange  = card.dataset.exchange || "Nasdaq";
      const price     = card.dataset.price;
      const change    = card.dataset.change;
      const changePct = card.dataset.changePct;
      const chartPath = card.dataset.chart;
      const marketCap = card.dataset.marketCap;
      const pe        = card.dataset.pe;
      const volume    = card.dataset.volume;
      const theme     = card.dataset.theme === "red" ? "down" : "up";

      let html = '';

      // Header
      html += '<div class="sc-header">';
      if (logo) html += '<img class="sc-logo" src="' + logo + '" alt="' + (name || ticker) + '" />';
      html += '<div class="sc-title-group">';
      if (name)   html += '<div class="sc-name">' + name + '</div>';
      if (ticker) html += '<div class="sc-ticker">' + ticker + ' · ' + exchange + '</div>';
      html += '</div></div>';

      // Price block
      html += '<div class="sc-price-block">';
      html += '<div class="sc-price">$' + (price || "0") + '</div>';
      if (change || changePct) {
        html += '<div class="sc-change-row">';
        html += '<div class="sc-change ' + theme + '">';
        html += '<span class="sc-change-arrow"></span>';
        html += '<span>' + (change || "") + '</span>';
        html += '</div>';
        if (changePct) html += '<div class="sc-change-pct">' + changePct + ' Today</div>';
        html += '</div>';
      }
      html += '</div>';

      // Chart
      if (chartPath) {
        html += '<div class="sc-chart-wrap">';
        html += '<svg viewBox="0 0 300 80" preserveAspectRatio="none">';
        html += '<path class="sc-chart-area ' + theme + '" d="' + chartPath + ' L300,80 L0,80 Z" />';
        html += '<path class="sc-chart-path ' + theme + '" d="' + chartPath + '" stroke-dasharray="400" stroke-dashoffset="400" />';
        html += '<circle class="sc-chart-dot ' + theme + '" cx="300" cy="0" r="0" />';
        html += '</svg></div>';
      }

      // Tabs
      html += '<div class="sc-tabs">';
      ["1D","1W","1M","3M","1Y","5Y"].forEach(function (t, i) {
        html += '<div class="sc-tab ' + (i === 0 ? 'active' : '') + '">' + t + '</div>';
      });
      html += '</div>';

      // Divider
      html += '<div class="sc-divider"></div>';

      // Stats
      if (marketCap || pe || volume) {
        html += '<div class="sc-stats">';
        if (marketCap) {
          html += '<div class="sc-stat"><div class="sc-stat-label">Market Cap</div><div class="sc-stat-value">' + marketCap + '</div></div>';
        }
        if (pe) {
          html += '<div class="sc-stat"><div class="sc-stat-label">P/E Ratio</div><div class="sc-stat-value">' + pe + '</div></div>';
        }
        if (volume) {
          html += '<div class="sc-stat"><div class="sc-stat-label">Today\'s Volume</div><div class="sc-stat-value">' + volume + '</div></div>';
        }
        html += '</div>';
      }

      card.innerHTML = html;

      // Position end dot on chart
      if (chartPath) {
        const svgPath = card.querySelector(".sc-chart-path");
        const dot     = card.querySelector(".sc-chart-dot");
        if (svgPath && dot) {
          const len = svgPath.getTotalLength();
          const end = svgPath.getPointAtLength(len);
          dot.setAttribute("cx", end.x);
          dot.setAttribute("cy", end.y);
          dot.setAttribute("r", "5");
        }
      }
    });
  })();
</script>
